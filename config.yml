# macOS Installer Configuration
# Customize this file with your preferred apps and tools

# Global settings
halt_on_error: false
notifications: true

# Dotfiles (runs first)
dotfiles:
  enabled: false  # Set to true and configure your repo
  repo: https://github.com/YOUR_USERNAME/dotfiles.git
  target_dir: ~/dotfiles
  backup_dir: ~/.dotfiles_backup
  symlinks:
    - source: zshrc
      target: ~/.zshrc
      name: Zsh config
    - source: gitconfig
      target: ~/.gitconfig
      name: Git config
    - source: vimrc
      target: ~/.vimrc
      name: Vim config

# macOS system preferences
macos_defaults:
  enabled: true
  restart_apps: true
  presets:
    - developer   # Show hidden files, fast key repeat, etc.
    - dock        # Auto-hide dock, no recents
    # - trackpad  # Tap to click, three-finger drag
    # - safari    # Dev tools, full URLs
    # - privacy   # Disable Siri suggestions
  custom: []
  # custom:
  #   - domain: com.apple.dock
  #     key: tilesize
  #     type: int
  #     value: 36

# Homebrew packages
homebrew:
  enabled: true
  taps:
    - homebrew/cask-fonts
    - homebrew/cask-versions

  formulae:
    - git
    - wget
    - curl
    - jq
    - tree
    - htop
    - terminal-notifier  # For macOS notifications
    - neovim
    - ripgrep
    - fzf
    - tmux
    - gh  # GitHub CLI

  casks:
    - visual-studio-code
    - iterm2
    - docker
    - rectangle
    - alfred
    - 1password
    - slack
    - notion
    - figma
    - postman

# Ruby version manager (rbenv)
rbenv:
  enabled: true
  ruby_versions:
    - 3.3.0
    - 3.2.2
  default_version: 3.3.0
  plugins:
    - name: rbenv-gemset
      repo: jf/rbenv-gemset
  global_gems:
    - bundler
    - rake
    - solargraph  # Ruby language server
    - rubocop
    - pry
    - nokogiri
    - sinatra

# Python version manager (pyenv)
pyenv:
  enabled: true
  python_versions:
    - 3.12.0
    - 3.11.0
  default_version: 3.12.0
  global_packages:
    - poetry
    - black
    - ruff
    - mypy
    - ipython

# Node.js version manager (fnm)
fnm:
  enabled: true
  node_versions:
    - 22
    - 20
  default_version: 22
  global_packages:
    - typescript
    - pnpm
    - yarn
    - tsx

# Development tools
codex:
  enabled: true
  vscode_extensions:
    - ms-python.python
    - ms-vscode.vscode-typescript-next
    - esbenp.prettier-vscode
    - dbaeumer.vscode-eslint
    - eamodio.gitlens
    - github.copilot
    - bradlc.vscode-tailwindcss

  npm_globals:
    - typescript
    - eslint
    - prettier
    - nodemon
    - yarn
    - pnpm

  pip_packages:
    - black
    - flake8
    - mypy
    - poetry

  custom_scripts:
    - name: Oh My Zsh
      install: sh -c "$(curl -fsSL https://raw.github.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
      rollback: rm -rf ~/.oh-my-zsh
      check: test -d ~/.oh-my-zsh

# Mac App Store apps (requires App Store sign-in)
appstore:
  enabled: true
  require_signin: true
  apps:
    - id: 497799835
      name: Xcode
    - id: 1475387142
      name: Tailscale
    - id: 937984704
      name: Amphetamine
    - id: 1176895641
      name: Spark
